<section class="not-found-page" dir="rtl" aria-labelledby="not-found-title">
  <div class="shop-container">
    <div class="not-found-card">
      <p class="not-found-code" aria-label="خطأ ٤٠٤">{{ text.code }}</p>
      <h1 id="not-found-title">{{ text.title }}</h1>
      <p class="not-found-description">{{ text.subtitle }}</p>
      <form class="not-found-search" (submit)="onSearchSubmit($event)" role="search">
        <label for="not-found-search">ابحث في المنتجات</label>
        <div class="not-found-search-row">
          <input
            id="not-found-search"
            type="search"
            [formControl]="searchControl"
            maxlength="100"
            autocomplete="off"
            placeholder="اسم القطعة التي تبحث عنها"
          />
          <button type="submit" class="shop-button shop-button-primary">
            <i class="pi pi-search" aria-hidden="true"></i><span>بحث</span>
          </button>
        </div>
      </form>
      <div class="not-found-actions">
        <a routerLink="/" class="shop-button shop-button-secondary">{{ text.backHomeText }}</a>
        <a routerLink="/products" class="not-found-catalog"
          >{{ text.browseCatalogText }} <i class="pi pi-arrow-left" aria-hidden="true"></i
        ></a>
      </div>
    </div>
  </div>
</section>

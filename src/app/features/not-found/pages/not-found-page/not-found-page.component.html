<div
  (mousemove)="onMouseMove($event)"
  class="min-h-[85vh] flex items-center justify-center px-4 py-16 relative overflow-hidden text-center bg-[#030308] select-none"
>
  <!-- Background 3D Canvas -->
  <div class="absolute inset-0 z-0 opacity-80 pointer-events-none flex items-center justify-center">
    <canvas #bgCanvas class="w-full h-full block"></canvas>
  </div>

  <!-- Ambient Glow Orbs -->
  <div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full bg-pink-600/20 blur-[130px] pointer-events-none animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2 w-96 h-96 rounded-full bg-cyan-500/20 blur-[130px] pointer-events-none animate-pulse"></div>

  <!-- Cyber Grid Overlay -->
  <div class="absolute inset-0 bg-[radial-gradient(#1e1b4b_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none z-0"></div>

  <!-- Main Card Container -->
  <div class="max-w-lg w-full glass-panel rounded-3xl p-8 md:p-12 border border-purple-500/30 shadow-[0_0_80px_rgba(139,92,246,0.25)] relative z-10 space-y-6 backdrop-blur-xl bg-neutral-950/70 transition-all duration-300 hover:border-purple-500/50">
    
    <!-- Animated 404 Glitch Number Badge -->
    <div class="relative inline-block">
      <span class="text-8xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 drop-shadow-[0_0_40px_rgba(236,72,153,0.6)] tracking-widest animate-pulse font-mono">
        404
      </span>
      <div class="absolute -top-2 -right-2 px-3 py-1 bg-pink-500/20 border border-pink-500/40 rounded-full text-pink-300 text-[10px] uppercase font-bold tracking-widest backdrop-blur-md shadow-lg">
        Dimension Warp
      </div>
    </div>

    <!-- Title & Subtitle -->
    <div class="space-y-3">
      <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
        {{ text.title }}
      </h1>
      <p class="text-sm text-neutral-400 leading-relaxed max-w-md mx-auto">
        {{ text.subtitle }}
      </p>
    </div>

    <!-- Quick Search Input -->
    <div class="pt-2">
      <form (ngSubmit)="onSearchSubmit()" class="relative max-w-sm mx-auto">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          name="search"
          placeholder="Search Katana, Gundam, Cosplay props..."
          class="w-full pl-10 pr-12 py-3 rounded-2xl bg-neutral-900/90 border border-neutral-700/80 text-white placeholder-neutral-500 text-xs focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all shadow-inner"
        />
        <i class="pi pi-search absolute left-3.5 top-3.5 text-neutral-400 text-sm"></i>
        <button
          type="submit"
          class="absolute right-2 top-2 bottom-2 px-3 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl transition-all flex items-center justify-center cursor-pointer shadow-md"
        >
          <i class="pi pi-arrow-right text-xs"></i>
        </button>
      </form>
    </div>

    <!-- Action Buttons -->
    <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a routerLink="/" class="w-full sm:w-auto">
        <app-glow-button [text]="text.backHomeText" icon="pi pi-home" variant="primary" />
      </a>
      <a routerLink="/products" class="w-full sm:w-auto">
        <app-glow-button [text]="text.browseCatalogText" icon="pi pi-box" variant="secondary" />
      </a>
    </div>

  </div>
</div>

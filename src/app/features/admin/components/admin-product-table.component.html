<p-table
  [value]="pagedProducts()"
  [paginator]="true"
  [rows]="rows()"
  [first]="first()"
  [totalRecords]="totalRecords()"
  [rowsPerPageOptions]="[5, 10, 20]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} products"
  (onPage)="pageChange.emit({ first: $event.first, rows: $event.rows })"
  styleClass="admin-table"
>
  <ng-template #header>
    <tr>
      <th>Product</th>
      <th>Category</th>
      <th>Price</th>
      <th>Rating</th>
      <th>Status</th>
      <th>Featured</th>
      <th>Updated</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template #body let-product>
    <tr>
      <td>
        <div class="flex items-center gap-3">
          <img [src]="product.image" [alt]="product.name" class="h-14 w-14 rounded-2xl object-cover" />
          <div>
            <div class="font-semibold text-white">{{ product.name }}</div>
            <div class="text-xs text-neutral-500">{{ product.slug }}</div>
          </div>
        </div>
      </td>
      <td>{{ product.category }}</td>
      <td>{{ product.price | currency: 'EGP' }}</td>
      <td>
        <div class="flex items-center gap-2">
          <p-rating [ngModel]="product.rating" [readonly]="true" />
          <span class="text-xs text-neutral-400">{{ product.rating | number: '1.1-1' }}</span>
        </div>
      </td>
      <td>
        <p-tag [severity]="product.isActive ? 'success' : 'contrast'" [value]="product.isActive ? 'Active' : 'Hidden'" />
      </td>
      <td>
        <p-tag [severity]="product.isFeatured ? 'info' : 'secondary'" [value]="product.isFeatured ? 'Featured' : 'Standard'" />
      </td>
      <td>{{ product.updatedAt | date: 'MMM d, y' }}</td>
      <td>
        <div class="flex flex-wrap gap-2">
          <p-button label="View" size="small" severity="contrast" variant="outlined" (onClick)="preview.emit(product.id)" />
          <p-button label="Edit" size="small" severity="info" variant="outlined" (onClick)="edit.emit(product.id)" />
          <p-button label="Copy" size="small" severity="help" variant="outlined" (onClick)="duplicate.emit(product.id)" />
          <p-button label="Delete" size="small" severity="danger" variant="outlined" (onClick)="delete.emit(product.id)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

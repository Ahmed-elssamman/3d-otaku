<article class="admin-card admin-glow-border relative overflow-hidden p-5">
  <div class="absolute inset-0 bg-gradient-to-br" [class]="accentClass()"></div>
  <div class="relative flex items-start justify-between gap-4">
    <div class="space-y-2">
      <p class="text-xs uppercase tracking-[0.3em] text-neutral-500">{{ title() }}</p>
      <h3 class="text-3xl font-black text-white">{{ value() }}</h3>
      <p class="text-sm text-neutral-400">{{ subtitle() }}</p>
    </div>
    <div class="flex h-11 w-11 items-center justify-center rounded-2xl border border-white/10 bg-white/5 text-cyan-300">
      <i [class]="icon()" class="text-lg"></i>
    </div>
  </div>
</article>

<aside
  id="admin-navigation"
  class="admin-sidebar fixed inset-y-0 start-0 z-40 w-72 border-e border-[var(--shop-line)] bg-white p-5"
  [class.sidebar-open]="isOpen()"
>
  <div class="flex h-full flex-col">
    <div class="mb-7 flex items-center gap-3">
      <span
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-[#eef3e9] text-[var(--shop-primary)]"
        ><i class="pi pi-box" aria-hidden="true"></i
      ></span>
      <div>
        <p class="text-xs text-[var(--shop-muted)]">أوتاكو · إدارة المتجر</p>
        <h2 class="text-lg font-bold text-[var(--shop-ink)]">لوحة الإدارة</h2>
      </div>
      <button
        type="button"
        class="ms-auto rounded-lg p-3 lg:hidden"
        aria-label="إغلاق قائمة الإدارة"
        (click)="requestClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
    <nav class="space-y-1 overflow-y-auto" aria-label="قائمة الإدارة">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          (click)="requestClose()"
          routerLinkActive="admin-nav-active"
          [routerLinkActiveOptions]="item.matchOptions"
          class="admin-nav-link flex items-center gap-3 rounded-lg px-4 py-3 text-sm"
        >
          <i [class]="item.icon" aria-hidden="true"></i><span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="mt-auto border-t border-[var(--shop-line)] pt-5">
      <p class="text-xs leading-6 text-[var(--shop-muted)]">
        بيانات العملاء متاحة لإدارة الطلبات ومتابعة التواصل فقط.
      </p>
      <button
        type="button"
        class="shop-button shop-button-secondary mt-3 w-full"
        (click)="requestLogout()"
      >
        تسجيل الخروج
      </button>
    </div>
  </div>
</aside>

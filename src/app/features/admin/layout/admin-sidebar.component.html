<aside
  class="fixed inset-y-0 start-0 z-40 w-72 border-e border-white/10 bg-[#090512]/95 p-5 backdrop-blur-xl transition-transform duration-300 lg:translate-x-0"
  [class.-translate-x-full]="!isOpen()"
>
  <div class="flex h-full flex-col">
    <div class="mb-8 flex items-center gap-3">
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-fuchsia-500/30 to-cyan-400/20 text-fuchsia-200 shadow-[0_0_35px_rgba(217,70,239,0.25)]">
        <i class="pi pi-sparkles text-lg"></i>
      </div>
      <div>
        <p class="text-xs uppercase tracking-[0.35em] text-cyan-300">3D Otaku</p>
        <h2 class="text-lg font-black text-white">Admin</h2>
      </div>
    </div>

    <nav class="space-y-2">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          (click)="closeMobile.emit()"
          routerLinkActive="bg-white/10 text-white shadow-[0_0_35px_rgba(34,211,238,0.15)]"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="flex items-center gap-3 rounded-2xl border border-transparent px-4 py-3 text-sm font-medium text-neutral-400 transition-all hover:border-cyan-400/20 hover:bg-white/5 hover:text-white"
        >
          <i [class]="item.icon" class="text-sm"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="mt-auto rounded-3xl border border-fuchsia-500/20 bg-gradient-to-br from-fuchsia-500/10 to-cyan-400/10 p-4">
      <p class="text-xs uppercase tracking-[0.3em] text-neutral-400">Session</p>
      <h3 class="mt-2 text-base font-bold text-white">Admin control room</h3>
      <p class="mt-2 text-sm text-neutral-400">Manage products, branding, and order entry points from one panel.</p>
      <button class="admin-action-button mt-4 w-full justify-center" (click)="logout.emit()">Logout</button>
    </div>
  </div>
</aside>

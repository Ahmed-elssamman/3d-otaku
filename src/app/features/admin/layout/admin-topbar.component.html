<header
  class="admin-topbar flex items-center justify-between gap-3 rounded-xl border border-[var(--shop-line)] bg-white px-4 py-4 lg:px-6"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      id="admin-navigation-toggle"
      type="button"
      aria-label="فتح قائمة الإدارة"
      aria-controls="admin-navigation"
      [attr.aria-expanded]="sidebarOpen()"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg border border-[var(--shop-line)] lg:hidden"
      (click)="toggleNavigation()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    <div>
      <p class="text-xs text-[var(--shop-muted)]">إدارة أوتاكو</p>
      <h1 class="text-lg font-bold text-[var(--shop-ink)] lg:text-2xl">{{ pageTitle() }}</h1>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <a routerLink="/" class="text-link hidden md:inline-flex"
      >زيارة المتجر <i class="pi pi-arrow-up-left" aria-hidden="true"></i
    ></a>
    <div class="hidden border-s border-[var(--shop-line)] ps-4 sm:block">
      <p class="text-xs text-[var(--shop-muted)]">حساب الإدارة</p>
      <p class="max-w-40 truncate text-sm font-bold">{{ adminName() }}</p>
    </div>
  </div>
</header>

<div class="flex flex-col items-center justify-center p-12 text-center min-h-[300px]">
  <div class="relative w-20 h-20 mb-6">
    <div class="absolute inset-0 rounded-full border-4 border-purple-600/20 border-t-purple-500 animate-spin"></div>
    <div class="absolute inset-2 rounded-full border-4 border-pink-500/20 border-b-pink-500 animate-spin opacity-80" style="animation-duration: 1.5s; animation-direction: reverse;"></div>
    <div class="absolute inset-4 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-400 opacity-60 blur-sm animate-pulse"></div>
  </div>
  <p class="text-sm font-semibold tracking-wider text-purple-300 uppercase animate-pulse">{{ text() }}</p>
</div>

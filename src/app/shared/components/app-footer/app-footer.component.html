<footer class="bg-[#030308] border-t border-red-500/30 text-neutral-300 relative overflow-hidden select-none">
  
  <!-- Glowing Fiery Red Top Accent Bar -->
  <div class="h-[2px] w-full bg-gradient-to-r from-transparent via-red-500 to-transparent opacity-90 animate-pulse"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6 relative z-10">
    
    <!-- Compact Brand & Contact Bar Grid -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
      
      <!-- Brand & Tagline -->
      <div class="md:col-span-4 space-y-2">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-red-600 via-rose-500 to-amber-500 p-[1.5px] shadow-md">
            <div class="w-full h-full bg-neutral-950 rounded-[10px] flex items-center justify-center">
              <i class="pi pi-box text-red-500 text-sm"></i>
            </div>
          </div>
          <div>
            <h2 class="text-xl font-black text-white tracking-wider font-mono">
              3D <span class="vt-anime-gradient">OTAKU</span>
            </h2>
            <span class="text-[10px] text-rose-400 font-bold uppercase tracking-wider block">
              WORLD'S #1 ANIME 3D FORGE • アニメ鍛冶屋
            </span>
          </div>
        </div>
        <p class="text-xs text-neutral-400 leading-relaxed font-normal">
          Bringing Anime Legends & Weapon Replicas into Tangible 3D Reality. 100% Cosplay Safe.
        </p>
      </div>

      <!-- Compact Contact Quick Badges -->
      <div class="md:col-span-8 grid grid-cols-2 sm:grid-cols-3 gap-3">
        
        <!-- WhatsApp -->
        <a
          [href]="'https://wa.me/' + whatsAppNumber.replace(/[^0-9]/g, '')"
          target="_blank"
          rel="noopener noreferrer"
          class="p-3 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 hover:bg-emerald-900/30 flex items-center gap-3 transition-all cursor-pointer group"
        >
          <div class="w-8 h-8 rounded-xl bg-emerald-600/90 text-white flex items-center justify-center text-sm shrink-0">
            <i class="pi pi-whatsapp"></i>
          </div>
          <div class="min-w-0">
            <span class="text-[9px] uppercase font-bold text-emerald-400 tracking-wider block">WhatsApp</span>
            <span class="text-xs font-bold text-white truncate block dir-ltr text-right">{{ whatsAppNumber }}</span>
          </div>
        </a>

        <!-- Phone -->
        <a
          [href]="'tel:' + storePhone"
          class="p-3 rounded-2xl border border-red-500/30 bg-red-950/20 hover:bg-red-900/30 flex items-center gap-3 transition-all cursor-pointer group"
        >
          <div class="w-8 h-8 rounded-xl bg-red-600/90 text-white flex items-center justify-center text-sm shrink-0">
            <i class="pi pi-phone"></i>
          </div>
          <div class="min-w-0">
            <span class="text-[9px] uppercase font-bold text-red-400 tracking-wider block">Support Phone</span>
            <span class="text-xs font-bold text-white truncate block dir-ltr text-right">{{ storePhone }}</span>
          </div>
        </a>

        <!-- Location -->
        <div class="p-3 rounded-2xl border border-purple-500/30 bg-purple-950/20 flex items-center gap-3 col-span-2 sm:col-span-1">
          <div class="w-8 h-8 rounded-xl bg-purple-600/90 text-white flex items-center justify-center text-sm shrink-0">
            <i class="pi pi-map-marker"></i>
          </div>
          <div class="min-w-0">
            <span class="text-[9px] uppercase font-bold text-purple-400 tracking-wider block">Studio HQ</span>
            <span class="text-xs font-bold text-white truncate block">Cairo, Egypt</span>
          </div>
        </div>

      </div>

    </div>

    <!-- Bottom Safety & Copyright Bar -->
    <div class="pt-4 border-t border-neutral-800/80 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2 text-neutral-400">
        <i class="pi pi-shield text-red-400 text-xs"></i>
        <span class="text-[11px]">© {{ currentYear }} <strong class="text-white">{{ brandName }}</strong>. All rights reserved.</span>
      </div>

      <!-- Social Links -->
      <div class="flex items-center gap-2">
        <a
          [href]="'https://wa.me/' + whatsAppNumber.replace(/[^0-9]/g, '')"
          target="_blank"
          class="w-7 h-7 rounded-lg bg-neutral-900 border border-neutral-800 hover:border-emerald-500 text-neutral-400 hover:text-emerald-400 transition-all flex items-center justify-center text-xs"
          title="WhatsApp"
        >
          <i class="pi pi-whatsapp"></i>
        </a>
        <a
          href="https://facebook.com"
          target="_blank"
          class="w-7 h-7 rounded-lg bg-neutral-900 border border-neutral-800 hover:border-red-500 text-neutral-400 hover:text-red-400 transition-all flex items-center justify-center text-xs"
          title="Facebook"
        >
          <i class="pi pi-facebook"></i>
        </a>
        <a
          href="https://instagram.com"
          target="_blank"
          class="w-7 h-7 rounded-lg bg-neutral-900 border border-neutral-800 hover:border-rose-500 text-neutral-400 hover:text-rose-400 transition-all flex items-center justify-center text-xs"
          title="Instagram"
        >
          <i class="pi pi-instagram"></i>
        </a>
      </div>
    </div>

  </div>
</footer>

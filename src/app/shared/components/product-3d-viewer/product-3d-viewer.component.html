<div class="relative rounded-3xl overflow-hidden vt-card border border-neutral-800 p-2 shadow-2xl group">
  
  <!-- Interactive 3D Status Badge -->
  <div class="absolute top-4 left-4 z-20 flex items-center gap-2 px-3 py-1 rounded-full bg-neutral-900/90 backdrop-blur-md border border-neutral-800 text-neutral-200 text-xs font-semibold shadow-sm">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    <span>Real-Time 3D Engine (GLB)</span>
  </div>

  <!-- Interactive Controls Bar -->
  <div class="absolute top-4 right-4 z-20 flex items-center gap-2">
    <button
      (click)="toggleAutoRotate()"
      [title]="isAutoRotating() ? 'Pause Auto Rotation' : 'Enable Auto Rotation'"
      class="p-2 rounded-xl bg-neutral-900/90 backdrop-blur-md border border-neutral-800 text-neutral-300 hover:text-white hover:border-neutral-700 transition-all text-xs font-medium cursor-pointer flex items-center gap-1.5"
    >
      <i [class]="isAutoRotating() ? 'pi pi-pause' : 'pi pi-play'" class="text-xs"></i>
      <span class="hidden sm:inline">{{ isAutoRotating() ? 'Pause' : 'Rotate' }}</span>
    </button>

    <button
      (click)="resetCamera()"
      title="Reset Camera View"
      class="p-2 rounded-xl bg-neutral-900/90 backdrop-blur-md border border-neutral-800 text-neutral-300 hover:text-white hover:border-neutral-700 transition-all text-xs font-medium cursor-pointer flex items-center gap-1.5"
    >
      <i class="pi pi-refresh text-xs"></i>
      <span class="hidden sm:inline">Reset</span>
    </button>
  </div>

  <!-- Instructions Badge -->
  <div class="absolute bottom-4 right-4 z-20 px-3 py-1 rounded-lg bg-neutral-900/90 backdrop-blur-md text-[11px] text-neutral-400 border border-neutral-800 pointer-events-none shadow-sm flex items-center gap-1.5">
    <i class="pi pi-arrows-alt text-neutral-500"></i>
    <span>360° Drag to rotate • Scroll to zoom</span>
  </div>

  <!-- 3D Model Viewer Container -->
  <div class="w-full bg-[#050505] rounded-2xl flex items-center justify-center min-h-[420px] md:min-h-[540px] relative">
    
    <model-viewer
      #viewer
      [attr.src]="product().modelUrl"
      [attr.poster]="product().image"
      (load)="onModelLoad()"
      camera-controls
      auto-rotate
      rotation-per-second="25deg"
      shadow-intensity="1.5"
      shadow-softness="0.8"
      exposure="1.1"
      environment-image="neutral"
      ar
      ar-modes="webxr scene-viewer quick-look"
      interaction-prompt="auto"
      touch-action="pan-y"
      style="width: 100%; height: 540px; border-radius: 1rem; --poster-color: transparent;">
      
      <!-- Custom Loading Slot -->
      <div slot="poster" class="w-full h-full flex flex-col items-center justify-center p-8 bg-neutral-950">
        <div class="relative w-12 h-12 mb-3">
          <div class="absolute inset-0 rounded-full border-2 border-neutral-800 border-t-white animate-spin"></div>
        </div>
        <p class="text-xs font-semibold uppercase tracking-wider text-neutral-400 animate-pulse">
          Loading 3D Engine...
        </p>
      </div>

    </model-viewer>

  </div>
</div>

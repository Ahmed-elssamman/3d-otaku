<a
  [routerLink]="['/products']"
  [queryParams]="{ category: category().name }"
  class="vt-card group relative block p-6 rounded-2xl border border-neutral-800 hover:border-neutral-700 overflow-hidden transition-all duration-300 cursor-pointer"
>
  <div class="relative z-10 flex items-start gap-4">
    <div class="w-12 h-12 rounded-xl bg-neutral-900 border border-neutral-800 flex items-center justify-center text-white text-xl group-hover:border-purple-500/50 group-hover:text-purple-400 transition-all duration-300 shrink-0">
      <i [class]="category().icon"></i>
    </div>
    
    <div class="flex-grow">
      <div class="flex items-center justify-between gap-2 mb-1">
        <h3 class="text-base font-bold text-white group-hover:text-purple-300 transition-colors">
          {{ category().name }}
        </h3>
        <span class="vt-badge text-[10px]">
          {{ category().itemCount }} Items
        </span>
      </div>
      <p class="text-neutral-400 text-xs leading-relaxed line-clamp-2">
        {{ category().description }}
      </p>
    </div>
  </div>

  <div class="mt-4 pt-3 border-t border-neutral-900 flex items-center justify-between text-xs font-semibold text-neutral-400 group-hover:text-white transition-colors">
    <span>Explore Category</span>
    <i class="pi pi-arrow-right text-[10px] group-hover:translate-x-1 transition-transform"></i>
  </div>
</a>

<div class="glass-panel rounded-2xl p-12 text-center max-w-md mx-auto my-12 border border-purple-500/20 shadow-2xl">
  <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-purple-950/60 border border-purple-500/30 flex items-center justify-center text-purple-400 text-3xl shadow-[0_0_20px_rgba(139,92,246,0.3)]">
    <i class="pi pi-search"></i>
  </div>
  <h3 class="text-xl font-bold text-white mb-2">{{ title() }}</h3>
  <p class="text-gray-400 text-sm mb-6 leading-relaxed">{{ message() }}</p>
  @if (buttonText()) {
    <button
      (click)="onReset()"
      class="px-6 py-2.5 rounded-xl bg-purple-600/30 hover:bg-purple-600/50 border border-purple-400/40 text-purple-200 font-medium text-sm transition-all duration-300 cursor-pointer"
    >
      {{ buttonText() }}
    </button>
  }
</div>

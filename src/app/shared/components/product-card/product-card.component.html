<div class="vt-card rounded-2xl overflow-hidden flex flex-col h-full group relative border border-neutral-800/80 hover:border-neutral-700 transition-all duration-300">
  <!-- Badge -->
  @if (displayBadge()) {
    <span class="absolute top-3 left-3 z-20 vt-badge vt-badge-pink shadow-sm">
      {{ displayBadge() }}
    </span>
  }

  <!-- Image Container (Rendered ONLY if product has an image) -->
  @if (hasImage()) {
    <div class="relative h-60 overflow-hidden bg-neutral-950">
      <img
        [src]="product().image"
        [alt]="product().name"
        class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500 opacity-90 group-hover:opacity-100"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-transparent opacity-80"></div>
      
      <!-- Category pill -->
      <span class="absolute bottom-3 left-3 z-10 text-[10px] font-semibold uppercase tracking-wider text-neutral-400 bg-neutral-900/90 px-2.5 py-1 rounded-md border border-neutral-800 backdrop-blur-md">
        {{ product().category }}
      </span>
    </div>
  }

  <!-- Content -->
  <div class="p-5 flex flex-col flex-grow justify-between bg-[#0a0a0a]">
    <div>
      <div class="flex items-start justify-between gap-2 mb-1.5">
        <h3 class="text-base font-bold text-white group-hover:text-purple-300 transition-colors line-clamp-1">
          {{ product().name }}
        </h3>
        <div class="flex items-center gap-1 text-amber-400 text-xs font-bold shrink-0">
          <i class="pi pi-star-fill text-[10px]"></i>
          <span>{{ formattedRating() }}</span>
        </div>
      </div>

      <p class="text-neutral-400 text-xs line-clamp-2 mb-4 leading-relaxed font-normal">
        {{ product().description }}
      </p>
    </div>

    <div>
      <!-- Price & Specs bar -->
      <div class="flex items-center justify-between mb-4 pt-3 border-t border-neutral-800/80 text-xs">
        <div class="flex flex-col">
          <span class="text-[10px] uppercase font-semibold text-neutral-500 tracking-wider">Price</span>
          <span class="text-lg font-black text-white">
            {{ formattedPrice() }}
          </span>
        </div>
        <div class="text-right">
          <span class="text-[10px] uppercase font-semibold text-neutral-500 tracking-wider">Material</span>
          <span class="block text-xs font-medium text-neutral-300">{{ product().material }}</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-2">
        <a
          [routerLink]="['/products', product().slug]"
          class="px-3 py-2 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-200 text-xs font-semibold text-center transition-all flex items-center justify-center gap-1.5 cursor-pointer"
        >
          <i class="pi pi-eye text-[11px] opacity-70"></i>
          <span>Details</span>
        </a>
        <button
          (click)="addToCartAndCheckout($event)"
          class="px-3 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold text-center transition-all flex items-center justify-center gap-1.5 shadow-sm cursor-pointer"
        >
          <i class="pi pi-shopping-bag text-xs"></i>
          <span>Order Now</span>
        </button>
      </div>
    </div>
  </div>
</div>
